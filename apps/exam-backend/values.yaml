  host: "0.0.0.0"
  port: "80" # Di Kubernetes port pod 80
  jwtSecret: "evaluasi-ai-jwt-secret-change-in-production"
  mongodbHost: "103.55.38.18"
  mongodbPort: "27017"
  mongodbUser: "admin"
  mongodbPassword: "4cWnKhzYnj3ad+R3TdZ5"
  mongodbDb: "evaluasi_ai"
  redisHost: "103.191.92.165"
  redisPort: "6379"
  redisPassword: "YbgWrLeAgEZfIyzM9zF8"
  writeBehindEnabled: "true"
  writeBehindFlushInterval: "5s"
  corsAllowOrigin: "https://exam.afresto.id,https://exam-admin.afresto.id,https://exam.afresto.id/"
